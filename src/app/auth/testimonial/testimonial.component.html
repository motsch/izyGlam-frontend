<section class="sponsor-section">
  <div class="container">
    <h2 class="title">Ils nous font confiance</h2>
    <div class="sponsor-logos">
      <a
        *ngFor="let sponsor of sponsors"
        [href]="sponsor.url"
        class="sponsor-logo"
        target="_blank"
        rel="noopener"
      >
        <img [src]="imgStorageUrl + sponsor.logo" [alt]="sponsor.name" />
      </a>
    </div>
  </div>
</section>
