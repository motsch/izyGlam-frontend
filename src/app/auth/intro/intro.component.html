<section class="intro-hero slide-bg" id="home">
  <div class="container custom-container">
    <div class="row align-items-center intro-grid">

      <!-- MEDIA : image/vidéo (mobile: en haut | ≥md: à droite) -->
      <div class="col-12 col-md-6 home-media">
        <div class="media-box">
          <img *ngIf="!paramVideo" [src]="imgStorageUrl + 'pro.png'" alt="illustration" class="hero-media" />

          <div *ngIf="paramVideo" class="video-wrapper">
            <video #videoElementIntro class="hero-media" autoplay muted playsinline loop>
              <source [src]="aPIimgStorageUrl + '/uploads/images/front/pro.mp4'" type="video/mp4" />
              {{ 'ABOUT.VIDEO_ERROR' | translate }}
            </video>
          </div>
        </div>
      </div>

      <!-- CONTENU : un seul bloc texte pour tous les écrans -->
      <div class="col-12 col-md-6 intro-content">
        <div class="slide-text-container">

          <h3 class="page-title-main">
            <span class="title-red">{{ "HOMEPAGE.TITLERED" | translate }}</span>
          </h3>

          <h1 class="page-title">
            <span class="title-red">{{ "HOMEPAGE.TITLERED2" | translate }}</span>
          </h1>

          <div class="main-title">
            <div class="text-wrapper" aria-live="polite">
              <ng-container *ngIf="textVisible">
                <span class="animated-text" [@slideFadeInOut] [attr.data-key]="currentKey">
                  {{ currentProposition | translate }}
                </span>
              </ng-container>
            </div>
          </div>

          <div class="search-container">
            <form>
              <button class="search-button" (click)="onButtonClick()">
                {{ "INTRO.START" | translate }}
              </button>
            </form>
            <div *ngIf="locationError && search.city" class="error-message">
              {{ "INTRO.NORESULTS" | translate }}
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>
