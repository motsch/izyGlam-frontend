<section class="auth-page">
   <div class="animation-circle-inverse">
      <i></i>
      <i></i>
      <i></i>
   </div>
   <div class="animation-circle">
      <i></i>
      <i></i>
      <i></i>
   </div>
   <app-header [connected]="false" [page]="'connected'"></app-header>
   <div class="auth-card">
      <div class="text-left">
         <!--<img src="assets/images/title-line.png" alt="ligne de titre" class="img-fluid line">-->
         <p class="welcome-text">Entrer vos informations personnelles.</p>
      </div>
      <form class="auth-form">
         <div class="form-group">
            <input required="" name="loginlastname" type="text" class="form-control" [(ngModel)]="user.lastname"
               id="inputlastname" placeholder="Nom">
         </div>
         <div class="form-group">
            <input required="" name="loginfirstname" type="text" class="form-control" [(ngModel)]="user.firstname"
               id="inputfirstname" placeholder="Prénom">
         </div>
         <div class="form-group">
            <input required="" name="loginphone" type="text" class="form-control" [(ngModel)]="user.phone"
               id="inputphone" placeholder="Téléphone">
         </div>
         <div class="form-group">
            <input required="" name="loginemail" type="text" class="form-control" [(ngModel)]="user.email"
               id="inputemail" placeholder="Email">
         </div>
         <div class="form-group">
            <input required="" name="loginpassword" type="text" class="form-control" [(ngModel)]="user.password"
               id="inputpassword" placeholder="Mot de passe">
         </div>
         <div class="form-group">
            <input required="" name="loginpasswordConfirmed" type="text" class="form-control"
               [(ngModel)]="user.passwordConfirmed" id="inputpasswordConfirmed"
               placeholder="Confirmation de mot de passe">
         </div>
         <button type="submit" class="btn submit" (click)="validAjouterModifier()">Continuer</button>
         <div class="or-separator"><span>ou</span></div>
         <button type="button" class="btn google grey-btn"><img class="btn-icon" src="assets/images/google-icon.png">
            Continuer avec
            Google</button>
         <button type="button" class="btn google grey-btn"><img class="btn-icon" src="assets/images/apple-icon.png">
            Continuer avec
            Apple</button>
         <div class="or-separator"><span>ou</span></div>
         <button type="button" class="btn apple qr"><i class="fa fa-qrcode"></i> Connectez-vous avec le QR
            code</button>
      </form>
      <p class="small">En continuant, vous acceptez de recevoir des appels, des messages WhatsApp ou des textos
         (notamment par des méthodes automatiques) de la part d'Uber et de ses sociétés affiliées au numéro indiqué.
      </p>
   </div>
</section>
