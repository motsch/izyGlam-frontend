<section class="auth-page">
   <div class="animation-circle-inverse">
      <i></i>
      <i></i>
      <i></i>
   </div>
   <div class="animation-circle">
      <i></i>
      <i></i>
      <i></i>
   </div>
   <app-header [connected]="false" [page]="'connected'"></app-header>
   <div class="auth-card">
      <div class="text-left">
         <p class="welcome-text">{{ 'SIGNUP.TITLE' | translate }}</p>
      </div>
      <form class="auth-form">
         <div class="form-group">
            <input required="" name="loginlastname" type="text" class="form-control" [(ngModel)]="user.lastname"
               id="inputlastname" [placeholder]="placeholerFirstName">
         </div>
         <div class="form-group">
            <input required="" name="loginfirstname" type="text" class="form-control" [(ngModel)]="user.firstname"
               id="inputfirstname" [placeholder]="placeholerLastName">
         </div>
         <div class="form-group">
            <input required="" name="loginphone" type="text" class="form-control" [(ngModel)]="user.phone"
               id="inputphone" [placeholder]="placeholerPhone">
         </div>
         <div class="form-group">
            <input required="" name="loginemail" type="text" class="form-control" [(ngModel)]="user.email"
               id="inputemail" [placeholder]="placeholerEmail">
         </div>
         <div class="form-group">
            <input required="" name="loginpassword" type="text" class="form-control" [(ngModel)]="user.password"
               id="inputpassword" [placeholder]="placeholderPassword">
         </div>
         <div class="form-group">
            <input required="" name="loginpasswordConfirmed" type="text" class="form-control"
               [(ngModel)]="user.passwordConfirmed" id="inputpasswordConfirmed"
               [placeholder]="placeholderConfirmPassword">
         </div>
         <button type="submit" class="btn submit" (click)="validAjouterModifier()">{{ 'SIGNUP.CONTINUER' | translate }}</button>
         <!--
         <div class="or-separator"><span>ou</span></div>
         <button type="button" class="btn google grey-btn"><img class="btn-icon"
               [src]="imgStorageUrl+'google-icon.png'">
            Continuer avec
            Google</button>
         <button type="button" class="btn google grey-btn"><img class="btn-icon" [src]="imgStorageUrl+'apple-icon.png'">
            Continuer avec
            Apple</button>-->
         <div class="or-separator"><span>{{ 'SIGNUP.OR' | translate }}</span></div>
         <button type="button" class="btn apple qr"><i class="fa fa-qrcode"></i> {{ 'SIGNUP.QRCODE' | translate }}</button>
      </form>
      <p class="small">{{ 'SIGNUP.CGU' | translate }}</p>
   </div>
</section>
