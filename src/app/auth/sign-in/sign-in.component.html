<section class="auth-page">
   <div class="animation-circle-inverse">
      <i></i>
      <i></i>
      <i></i>
   </div>
   <div class="animation-circle">
      <i></i>
      <i></i>
      <i></i>
   </div>
   <app-header [connected]="false" [page]="'connected'"></app-header>
   <div class="auth-card">
      <div class="text-left">
         <!--<img src="assets/images/title-line.png" alt="ligne de titre" class="img-fluid line">-->
         <p class="welcome-text">{{ 'LOGIN.TITLE' | translate }}</p>
      </div>
      <form class="auth-form">
         <div class="form-group">
            <input [required]="true" class="form-control" name="login[username]" [(ngModel)]="user.login" type="email"
               [placeholder]="placeholderEmail">
         </div>
         <div class="form-group">
            <input id="inputPassword" type="password" class="form-control" [required]="true" [(ngModel)]="user.password"
               name="login[password]" [placeholder]="placeholderPassword">
            <a routerLink="/forget-password" class="forgot-pass">{{ 'LOGIN.FORGET_PASSWORD' | translate }}</a>
         </div>
         <button type="submit" class="btn submit" (click)="onSubmit()">{{ 'LOGIN.CONTINUER' | translate }}</button>
         <!--
         <div class="or-separator"><span>ou</span></div>
         <button type="submit" class="btn google grey-btn" (click)="onMoreOptions()">Se connecter autrement</button>
         <div class="or-separator"><span>ou</span></div>
         <button type="button" class="btn google grey-btn"><img class="btn-icon"
               [src]="imgStorageUrl+'google-icon.png'">
            Continuer avec
            Google</button>
         <button type="button" class="btn google grey-btn"><img class="btn-icon" [src]="imgStorageUrl+'apple-icon.png'">
            Continuer avec
            Apple</button>
         -->
         <div class="or-separator"><span>{{ 'LOGIN.OR' | translate }}</span></div>
         <button type="button" class="btn apple qr"><i class="fa fa-qrcode"></i> {{ 'LOGIN.QRCODE' | translate }}</button>
      </form>
      <p class="small">{{ 'LOGIN.CGU' | translate }}</p>
   </div>
</section>
