<section class="auth-page">
   <div class="animation-circle-inverse">
      <i></i>
      <i></i>
      <i></i>
   </div>
   <div class="animation-circle">
      <i></i>
      <i></i>
      <i></i>
   </div>
   <app-header [connected]="false" [page]="'connected'"></app-header>
   <div class="auth-card">
      <div class="text-left">
         <!--<img src="assets/images/title-line.png" alt="ligne de titre" class="img-fluid line">-->
         <p class="welcome-text">Entrer vos identifiants de connexion.</p>
      </div>
      <form class="auth-form">
         <div class="form-group">
            <input [required]="true" class="form-control" name="login[username]" [(ngModel)]="user.login" type="email"
               placeholder="Adresse email">
         </div>
         <div class="form-group">
            <input id="inputPassword" type="password" class="form-control" [required]="true" [(ngModel)]="user.password"
               name="login[password]" placeholder="Mot de passe">
            <a routerLink="/forget-password" class="forgot-pass">Oublié?</a>
         </div>
         <button type="submit" class="btn submit" (click)="onSubmit()">Continuer</button>
         <div class="or-separator"><span>ou</span></div>
         <button type="button" class="btn google grey-btn"><img class="btn-icon"
               [src]="imgStorageUrl+'google-icon.png'">
            Continuer avec
            Google</button>
         <button type="button" class="btn google grey-btn"><img class="btn-icon" [src]="imgStorageUrl+'apple-icon.png'">
            Continuer avec
            Apple</button>
         <div class="or-separator"><span>ou</span></div>
         <button type="button" class="btn apple qr"><i class="fa fa-qrcode"></i> Connectez-vous avec le QR
            code</button>
      </form>
      <p class="small">En continuant, vous acceptez de recevoir des appels, des messages WhatsApp ou des textos
         (notamment par des méthodes automatiques) de la part d'Uber et de ses sociétés affiliées au numéro indiqué.
      </p>
   </div>
</section>
