<app-header
  *ngIf="!sessionService.isLoggedIn()"
  [connected]="false"
></app-header>
<!-- sidebar + content -->
<section class="container">
  <div class="row">
    <!-- sidebar -->
    <div class="col-lg-3">
      <!-- Collapsible wrapper -->
      <div class="mb-5" id="navbarSupportedContent">
        <div>
          <h3>{{shopInfo.name}}</h3>
        </div>
        <div>
          <span>
            {{shopInfo.note}}
            <img
              [src]="imgStorageUrl + 'star.png'"
              alt="starLogo"
              class="starLogo"
            />
          </span>
          <span>
            ({{shopInfo.noteCount}}+) <br />
            Frais de déplacement: 4,90€ <br />
            Distance max: {{shopInfo.maxDistance}}km
          </span>
          <div class="margin-top-20">
            {{shopInfo.description}}
          </div>
          <div>
            <img
              [src]="imgStorageUrl + 'money.png'"
              alt="starLogo"
              class="moneyLogo"
            />
          </div>
          <div>
            Paiement par CB et PayPal accepté<br />

            Appuyez pour consulter les horaires, les informations, etc
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-9">
      <div class="row">
        <div
          class="col-12 col-sm-12 col-md-6 col-lg-6"
          *ngFor="let item of shopItems"
        >
          <app-shop-item-card [item]="item"></app-shop-item-card>
        </div>
      </div>
    </div>
  </div>
</section>
