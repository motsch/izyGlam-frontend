<app-header *ngIf="!sessionService.isLoggedIn()" [connected]="false"></app-header>
<!-- sidebar + content -->
<section class="container padding-top-20pourc">
  <div class="row">
    <!-- sidebar -->
    <div class="col-lg-3 justify-content-center">
      <!-- Collapsible wrapper -->
      <div class="mb-5" id="navbarSupportedContent">
        <div>
          <div class="shop-hero"><!-- ⬅️ nouveau wrapper -->
            <div class="shop-info-header">
              <img [src]="APIimgStorageUrl + '/uploads/images/' + (shopInfo.image ? shopInfo.image : 'default.png')"
                alt="shopLogo" class="shopInfoImage" />

              <div class="shop-info-texts">
                <div>
                  <h4>{{ shopInfo.name }}</h4>
                  <div class="pink">{{ shopInfo.trad | translate }}</div>
                </div>
                <span>
                  {{ shopInfo.note ?? 5 }}
                  <img [src]="imgStorageUrl + 'star.png'" alt="starLogo" class="starLogo" />
                  ({{ shopInfo.noteCount ?? 0 }}+) <br />
                </span>

              </div>
            </div>

            <div class="description-wrapper">
              <div class="description-text">
                {{ shopInfo.description }}
              </div>

              <button class="toggle-button" (click)="toggleDescription()">
                {{ isExpanded ? ('SHOP.SEE_LESS' | translate) : ('SHOP.SEE_MORE' | translate) }}
              </button>
            </div>
          </div>


          <div *ngIf="isExpanded">
            <div *ngIf="shopInfo.galleryImages.length > 2" class="margin-top-40 bold">{{ "SHOP.GALLERY" | translate }}:
            </div>
            <div *ngIf="shopInfo.galleryImages.length > 2" class="margin-top-10">
              <div class="gallery-container">
                <div class="gallery-thumbnails">
                  <div *ngFor="let image of shopInfo.galleryImages" class="thumbnail" (click)="openLightbox(image)">
                    <img [src]="APIimgStorageUrl + image" alt="Gallery Image" />
                  </div>
                </div>
              </div>

              <!-- Lightbox Modal -->
              <div class="lightbox" *ngIf="isLightboxOpen">
                <div class="lightbox-content">
                  <span class="close-lightbox" (click)="closeLightbox()">&times;</span>
                  <img [src]="APIimgStorageUrl + selectedImage" class="lightbox-image" />
                  <a class="prev" (click)="prevImage()">&#10094;</a>
                  <a class="next" (click)="nextImage()">&#10095;</a>
                </div>
              </div>
            </div>
            <div>
              <img [src]="imgStorageUrl + 'money.png'" alt="starLogo" class="moneyLogo" />
            </div>
            <div>
              {{ "SHOP.PAYEMENT" | translate }}<br />
              {{ "SHOP.PRESS_FOR_INFO" | translate }}
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Gallery display section -->
    <div class="col-lg-9">
      <div class="row justify-content-left">
        <div class="col-12 col-sm-12 col-md-6 col-lg-6" *ngFor="let item of shopItems">
          <app-shop-item-card [item]="item"></app-shop-item-card>
        </div>
      </div>
    </div>
  </div>
</section>
