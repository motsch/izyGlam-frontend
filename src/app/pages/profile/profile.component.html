<div class="container margin-top-50">
    <div class="sidebar">
        <ul>
            <li class="active">Informations relatives au compte</li>
            <li>Sécurité</li>
            <li>Confidentialité et données</li>
        </ul>
    </div>
    <div class="content">
        <h1>Informations relatives au compte</h1>
        <div class="profile">
            <img src="assets/images/default.jpeg" alt="Profile Picture">
            <button class="edit-button">✎</button>
        </div>
        <div class="info">
            <h2>Informations de base</h2>
            <p><strong>Nom:</strong> {{ user.name }}</p>
            <p><strong>Numéro de téléphone:</strong> {{ user.phone }}</p>
            <p><strong>Adresse courriel:</strong> {{ user.email }}</p>
        </div>
    </div>
</div>
