<div class="page">

  <header class="topbar">
    <button class="icon-btn" (click)="goBack()" aria-label="Retour">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
        <path d="M15.5 19 8.5 12l7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="brand">izyGlam</div>

    <div class="spacer"></div>
  </header>

  <main class="content">
    <section class="hero">
      <h1>Comment souhaitez-vous réserver ?</h1>
      <p class="sub">
        Réservez en 2 minutes — à domicile, paiement sécurisé.
      </p>
    </section>

    <section class="choices">

      <!-- Primary -->
      <button class="choice choice-primary" type="button" (click)="goQuick()">
        <div class="choice-left">
          <div class="choice-title">Réservation rapide</div>
          <div class="choice-desc">Choisissez une prestation, on vous propose les créneaux.</div>
        </div>
        <div class="choice-right">
          <span class="pill">Recommandé</span>
          <svg viewBox="0 0 24 24" class="icon chevron" aria-hidden="true">
            <path d="M8.5 5 15.5 12l-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </button>

      <!-- Secondary -->
      <button class="choice" type="button" (click)="goProvider()">
        <div class="choice-left">
          <div class="choice-title">Choisir un prestataire</div>
          <div class="choice-desc">Parcourez les profils et réservez dans l’agenda.</div>
        </div>
        <div class="choice-right">
          <svg viewBox="0 0 24 24" class="icon chevron" aria-hidden="true">
            <path d="M8.5 5 15.5 12l-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </button>

    </section>

    <footer class="reassurance">
      <span class="dot"></span>
      <span>Paiement sécurisé • Pros vérifiées • Support réactif</span>
    </footer>
  </main>

</div>
