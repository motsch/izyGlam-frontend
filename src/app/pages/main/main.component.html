<!--<app-contact-us></app-contact-us>-->

<app-header *ngIf="!sessionService.isLoggedIn()" [connected]="false"></app-header>
<div class="container">
    <div class="banner" style="margin-top: 80px">
        <div class="category-filter">
            <div *ngFor="let category of categoriesFilter" class="margin-right-5"
                (click)="filterByCategory(category.filter)">
                <span class="category-item" [class.selected]="selectedCategory === category.filter">
                    <img class="icon" [src]="category.icon">
                </span>
                <span class="padding-left-10">{{ category.trad | translate | truncate : 10}}</span>
            </div>
            <!--<img *ngIf="filterClicked" src="assets/images/cancel.png" class="cancelFilter" (click)="cancelFilter()">-->
        </div>
    </div>
    <span *ngIf="!filterClicked">
        <div class="top-bar">
            <h3>{{ 'MAIN_PAGE.MOMENT' | translate }}</h3>
            <div class="scroll-buttons" *ngIf="promotedShops.length > 4">
                <button class="scroll-btn left-btn" (click)="scrollLeft('promo')">
                    <i class="fa fa-chevron-left"></i>
                </button>
                <button class="scroll-btn right-btn" (click)="scrollRight('promo')">
                    <i class="fa fa-chevron-right"></i>
                </button>
            </div>
        </div>
        <div class="categories">
            <div class="category-list" #scrollContainerPromo>
                <app-round-shop-card *ngFor="let item of promotedShops" [profile]="item"
                    [promoVisible]="item.promo.active" (click)="toShopPage(item._id)" class="card pointer"></app-round-shop-card>
            </div>
        </div>
        <div class="top-bar">
            <h3>{{ 'MAIN_PAGE.DISCOVER' | translate }}</h3>
            <div class="scroll-buttons">
                <button class="scroll-btn left-btn" (click)="scrollLeft('category')">
                    <i class="fa fa-chevron-left"></i>
                </button>
                <button class="scroll-btn right-btn" (click)="scrollRight('category')">
                    <i class="fa fa-chevron-right"></i>
                </button>
            </div>
        </div>
        <div class="categories">
            <div class="category-list" #scrollContainerCategory>
                <app-round-shop-card *ngFor="let item of filteredItemsAdecouvrir" [profile]="item" class="card pointer"
                    [promoVisible]="item.promo.active" (click)="toShopPage(item._id)"></app-round-shop-card>
            </div>
        </div>

        <div class="top-bar">
            <h3>{{ 'MAIN_PAGE.LIKED' | translate }}</h3>
            <div class="scroll-buttons">
                <button class="scroll-btn left-btn" (click)="scrollLeft('around')">
                    <i class="fa fa-chevron-left"></i>
                </button>
                <button class="scroll-btn right-btn" (click)="scrollRight('around')">
                    <i class="fa fa-chevron-right"></i>
                </button>
            </div>
        </div>
        <div class="categories">
            <div class="category-list" #scrollContainerAround>
                <!--<app-shop-card *ngFor="let item of filteredItems" [item]="item" class="card"></app-shop-card>-->
                <app-round-shop-card *ngFor="let item of filteredItemsApprecier" [profile]="item" [promoVisible]="item.promo.active"
                    class="card pointer" (click)="toShopPage(item._id)"></app-round-shop-card>
            </div>
        </div>

        <div class="top-bar">
            <h3>{{ 'MAIN_PAGE.SMART' | translate }}</h3>
            <div class="scroll-buttons">
                <button class="scroll-btn left-btn" (click)="scrollLeft('around')">
                    <i class="fa fa-chevron-left"></i>
                </button>
                <button class="scroll-btn right-btn" (click)="scrollRight('around')">
                    <i class="fa fa-chevron-right"></i>
                </button>
            </div>
        </div>
        <div class="categories">
            <div class="category-list" #scrollContainerAround>
                <!--<app-shop-card *ngFor="let item of filteredItems" [item]="item" class="card"></app-shop-card>-->
                <app-round-shop-card *ngFor="let item of filteredItemsMalin" [profile]="item" [promoVisible]="item.promo.active"
                    class="card pointer" (click)="toShopPage(item._id)"></app-round-shop-card>
            </div>
        </div>
        <div class="top-bar">
            <h3>{{ 'MAIN_PAGE.TOP10' | translate }}</h3>
            <div class="scroll-buttons">
                <button class="scroll-btn left-btn" (click)="scrollLeft('top10')">
                    <i class="fa fa-chevron-left"></i>
                </button>
                <button class="scroll-btn right-btn" (click)="scrollRight('top10')">
                    <i class="fa fa-chevron-right"></i>
                </button>
            </div>
        </div>
        <div class="categories">
            <div class="category-list" #scrollContainerTop10>
                <app-round-shop-card *ngFor="let item of filteredItemsTop10" [profile]="item" [promoVisible]="item.promo.active"
                    class="card pointer" (click)="toShopPage(item._id)"></app-round-shop-card>
            </div>
        </div>
    </span>
    <span *ngIf="filterClicked">
        <div class="padding-top-10">
            <h3>{{ 'MAIN_PAGE.SEARCHRESULT' | translate }}</h3>
            <div class="row test66"> <!-- Utilisation de 'row' pour démarrer une grille -->
                <app-round-shop-card *ngFor="let item of filteredItems" [profile]="item"
                    [promoVisible]="item.promo.active" class="card pointer"></app-round-shop-card>
                <!-- Chaque carte prendra toute la largeur sur les très petits écrans, la moitié de la largeur sur les petits écrans, un quart sur les moyens et un tiers sur les grands écrans -->
            </div>
        </div>
    </span>
</div>
