<div class="horizontal-section-wrapper">
  <div class="section-header">
    <h3>{{ title }}</h3>
  </div>

  <div class="horizontal-scroll-wrapper">
    <div #scrollContainerAds class="scrollable-shop-list drag-scroll" appDragScroll>
      <ng-container *ngFor="let item of displayItems">
        <!-- Shop -->
        <div
          class="shop-card-wrapper track-card"
          *ngIf="item.type === 'shop'"
          [attr.data-pub-id]="item.data._id"
          data-type="shop"
        >
          <app-round-shop-card
            [shop]="item.data"
            [me]="me"
            [promoVisible]="item.data.promo?.active"
            (loaded)="onShopLoaded(item.data._id)"
          ></app-round-shop-card>
        </div>

        <!-- Pub -->
        <div
          class="shop-card-wrapper margin-right-50 margin-left-10 pub-card track-card"
          *ngIf="item.type === 'ad'"
          [attr.data-pub-id]="item.data._id"
          data-type="ad"
        >
          <a [href]="item.data.lien" target="_blank">
            <img
            [src]="imgStorageUrl + 'uploads/images/pub/' + item.data.image"
              
              alt="Publicité"
              class="shop-ad-banner"
              (click)="onAdClick(item.data)"
            />
          </a>
        </div>
      </ng-container>
    </div>
  </div>
</div>
