<div class="modal-header">
    <h3 class="modal-title">{{ "EMPLOYEE_MANAGEMENT.TITLE" | translate }}</h3>
    <button type="button" class="btn-close" (click)="close()"></button>
  </div>
  <div class="modal-body">
    <div class="form-group">
      <label for="creditAmount">{{ "EMPLOYEE_MANAGEMENT.AMOUNT" | translate }}:</label>
      <input
      [(ngModel)]="amount"
      class="input-style"
      type="number"
      id="confirmPassword"
      name="confirmPassword"
      required
    />
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary grey-button" (click)="close()">{{ "EMPLOYEE_MANAGEMENT.CANCEL" | translate }}</button>
    <button type="button" class="btn btn-primary red-button" (click)="credit()">{{ "EMPLOYEE_MANAGEMENT.SAVE" | translate }}</button>
    
  </div>
