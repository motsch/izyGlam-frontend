<!-- review-modal.component.html -->
<div class="modal-overlay" (click)="close()"></div>
<div class="modal-container">
  <div class="modal-header">
    <h2>Noter votre commande</h2>
    <button class="close-btn" (click)="close()">&times;</button>
  </div>

  <form (ngSubmit)="submitReview()" class="review-form">

    <!-- Détails réservation -->
    <div class="card">
      <h3>{{ booking?.title }}</h3>
      <p>Date : {{ booking?.start | date:'medium' }}</p>
      <p>Service : {{ booking?.productName }}</p>
    </div>

    <!-- Sélecteur de note -->
    <div class="card">
      <h3>Note (sur 5)</h3>
      <input type="range" min="1" max="5" step="1" [(ngModel)]="rating" name="rating" (input)="onRatingChange($event)" />
      <div class="range-values">
        <span *ngFor="let n of [1,2,3,4,5]" [class.active]="rating === n">{{ n }}</span>
      </div>
    </div>

    <!-- Avis -->
    <div class="card">
      <h3>Votre avis</h3>
      <textarea [(ngModel)]="reviewText" name="reviewText" placeholder="Décrivez votre expérience..." required></textarea>
    </div>

    <button type="submit" [disabled]="!rating">Envoyer</button>
  </form>
</div>
