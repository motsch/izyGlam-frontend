<div class="main-section">
  <div class="container custom-container">
    <div class="row">
      <div class="col-md-12 content right-side">
        <div class="form">
          <h2 *ngIf="!alreadyProfessionnal">{{ "CREATION_SHOP.TITLE" | translate }}</h2>
          <h2 *ngIf="alreadyProfessionnal">{{ "CREATION_SHOP.TITLE2" | translate }}</h2>
          <div *ngIf="alreadyProfessionnal" class="color_red margin-bottom-20">{{ "CREATION_SHOP.ALREDAY_SHOP" |
            translate }}</div>
          <div *ngIf="!isUserConnected" class="color_red margin-bottom-20">{{ "CREATION_SHOP.NOT_CONNECTED" | translate
            }}</div>

          <div *ngIf="!alreadyProfessionnal" class="margin-bottom-20"></div>
          <label for="establishment-name">{{
            "CREATION_SHOP.NAME" | translate
            }}</label>
          <input [disabled]="!isUserConnected" type="text" id="establishment-name" name="establishment-name"
            [(ngModel)]="newShopUser.name" onchange="formChecking('companyName')" placeholder="Sab Beauty" />

          <label for="street">{{ "CREATION_SHOP.STREET" | translate }}</label>
          <input [disabled]="!isUserConnected" id="street" name="street" [(ngModel)]="newShopUser.street"
            placeholder="123, Main Street" />

          <div class="row input-group-row">
            <div class="col-md-6">
              <label for="floor">{{ "CREATION_SHOP.FLOOR" | translate }}</label>
              <input [disabled]="!isUserConnected" type="text" id="floor" name="floor" placeholder="123"
                [(ngModel)]="newShopUser.floor" />
            </div>


            <!-- 1. Choix du pays -->
            <div class="col-md-6">
              <label for="country">{{
                "CREATION_SHOP.COUNTRY" | translate
                }}</label>
              <!-- Sélecteur de pays -->

              <select [(ngModel)]="selectedCountry" name="country" (change)="onCountryChange()" required>
                <option value="">-- {{ "CREATION_SHOP.CHOOSE_COUNTRY" | translate }} --</option>
                <option *ngFor="let country of availableCountries" [value]="country">{{ country }}</option>
              </select>
              <input *ngIf="availableCountries.length === 1" type="hidden" name="country"
                [(ngModel)]="selectedCountry" />
            </div>
          </div>

          <!-- 2. Code postal -->
          <input type="text" name="postalCode" placeholder="Code postal" [(ngModel)]="postalCode"
            (change)="onPostalCodeEntered()" required maxlength="10" />

          <!-- 3. Villes correspondant au code postal -->
          <div class="row input-group-row">
            <div class="col-md-6">
              <label for="city">{{ "CREATION_SHOP.CITY" | translate }}</label>
              <!-- Sélecteur de ville -->
              <select *ngIf="availableCities.length > 0" [(ngModel)]="selectedCity" name="city" required>
                <option value="">-- {{ "CREATION_SHOP.CHOOSE_CITY" | translate }} --</option>
                <option *ngFor="let city of availableCities" [value]="city">{{ city.nom }}</option>
              </select>
            </div>
          </div>
          <!-- 5. Rue -->
          <input type="text" [(ngModel)]="newAddress.street" name="street" placeholder="Rue" required />

          <div class="row input-group-row">
            <label for="business-type">{{
              "CREATION_SHOP.BUSINESSTYPE" | translate
              }}</label>
            <select [disabled]="!isUserConnected" id="business-type" name="business-type"
              [(ngModel)]="newShopUser.companyType">
              <option value="coiffure">{{ "MAIN_CATEGORY.COIFFURE" | translate }}</option>
              <option value="manucure">{{ "MAIN_CATEGORY.MANUCURE" | translate }}</option>
              <option value="massage">{{ "MAIN_CATEGORY.MASSAGE" | translate }}</option>
              <option value="maquillage">{{ "MAIN_CATEGORY.MAQUILLAGE" | translate }}</option>
              <option value="epilation">{{ "MAIN_CATEGORY.EPILATION" | translate }}</option>
              <option value="bronzage">{{ "MAIN_CATEGORY.BRONZAGE" | translate }}</option>
              <option value="partum">{{ "MAIN_CATEGORY.PARTUM" | translate }}</option>
              <option value="nutrition">{{ "MAIN_CATEGORY.NUTRITION"| translate }}</option>
              <option value="fitness">{{ "MAIN_CATEGORY.FITNESS" | translate }}</option>
              <option value="acupunture">{{ "MAIN_CATEGORY.ACUPUNCTURE" | translate }}</option>
              <option value="stylisme">{{ "MAIN_CATEGORY.STYLISME" | translate }}</option>
              <option value="relaxation">{{ "MAIN_CATEGORY.YOGA" | translate }}</option>
              <option value="elevation">{{ "MAIN_CATEGORY.DEVELOPPEMENT" | translate }}</option>
              <!-- Add more options here -->
            </select>
          </div>
          <div class="whatsapp">
            <input [disabled]="!isUserConnected" type="checkbox" id="whatsapp" [(ngModel)]="newShopUser.ccvaccepted" />
            <label for="whatsapp">{{
              "CREATION_SHOP.WHATSAPP" | translate
              }}</label>
          </div>

          <button [disabled]="!isUserConnected" (click)="onSubmit()" type="submit">
            {{ "CREATION_SHOP.BUTTON" | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="error" class="error">{{ error }}</div>
</div>
