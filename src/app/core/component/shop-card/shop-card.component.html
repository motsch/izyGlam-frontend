<div class="card">
    <div class="card-header" [ngStyle]="{'background-image': 'url(' + imgStorageUrl + imageUrl + ')'}">
        <span class="rating">{{item.note}}</span>
    </div>
    <div class="card-body">
        <h1>{{item.name}}</h1>
        <p class="delivery-info">{{ "SHOP_ARTICLES_MANAGEMENT.AVG_PRICE" | translate }} : {{item.averagePrice}} · {{item.minimumDelay}} {{item.delayScale}}</p>
    </div>
</div>
