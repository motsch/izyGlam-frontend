<h2 mat-dialog-title>Titre de la fenêtre modale</h2>
<mat-dialog-content>
  <div class="demo-app-calendar">
    <div class="row text-center">
      <div class="col-md-12">
        <div class="btn-group">
          <button
            class="btn btn-primary"
            mwlCalendarPreviousView
            [(viewDate)]="viewDate"
            [view]="view"
          >
            Précédent
          </button>
          <button
            class="btn btn-outline-secondary"
            mwlCalendarToday
            [(viewDate)]="viewDate"
          >
            Aujourd'hui
          </button>
          <button
            class="btn btn-primary"
            mwlCalendarNextView
            [(viewDate)]="viewDate"
            [view]="view"
          >
            Suivant
          </button>
        </div>
      </div>
    </div>
    <br />
    <mwl-calendar-week-view
      [viewDate]="viewDate"
      [events]="events"
    >
    </mwl-calendar-week-view>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Fermer</button>
</mat-dialog-actions>
