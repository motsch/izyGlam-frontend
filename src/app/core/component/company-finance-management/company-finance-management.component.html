<div class="form">
    <div class="row">  
      <!-- Section Crédit du compte entreprise -->
      <div class="col-12 margin-top-30">
        <h2>Créditer le compte de l'entreprise</h2>
        <form (ngSubmit)="creditCompanyAccount()">
          <div class="form-group">
            <label for="companyBalance">Solde actuel :</label>
            <input
              type="text"
              id="companyBalance"
              class="form-control"
              [value]="myCompany.credit | currency : 'EUR'"
              disabled
            />
          </div>
          <div class="form-group">
            <label for="amount">Montant à créditer :</label>
            <input
              [(ngModel)]="creditAmount"
              class="input-style"
              type="number"
              id="confirmPassword"
              name="confirmPassword"
              required
            />
          </div>
          <button type="submit" class="btn btn-success">
            Créditer le compte de l'entreprise
          </button>
        </form>
      </div>
  
      <!-- Section Facturation -->
      <div class="col-12 margin-top-50">
        <h2>Suivi des dépenses</h2>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Date</th>
              <th>Montant</th>
              <th>Employé</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let invoice of invoices">
              <td>{{ invoice.date | date : "short" }}</td>
              <td>{{ invoice.amount | currency : "EUR" }}</td>
              <td>
                {{ invoice.employee.firstname }} {{ invoice.employee.lastname }}
              </td>
              <td>{{ invoice.description }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
