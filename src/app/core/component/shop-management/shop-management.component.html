<div class="container">
  <div class="form">
    <div class="form-section">
      <div class="column">
        <label for="name">Nom de la boutique</label>
        <input
          disabled
          [(ngModel)]="shopCopyData.name"
          class="input-style"
          type="text"
          id="name"
        />
      </div>
      <div class="column">
        <label for="imageUpload">Télécharger une image</label>
        <input
          type="file"
          id="imageUpload"
          (change)="onFileSelected($event)"
          accept="image/*"
          class="input-style"
        />

        <!-- Affichage de l'image sélectionnée -->
        <div *ngIf="imagePreview">
          <p>Aperçu de l'image :</p>
          <img
            [src]="imagePreview"
            alt="Aperçu de l'image"
            class="image-preview small-preview"
          />
        </div>

        <!-- Bouton pour uploader l'image -->
        <button
          class="btn btn-primary"
          (click)="uploadImage()"
          [disabled]="!selectedFile"
        >
          Upload Image
        </button>
      </div>
    </div>

    <div>
      <label for="description">Description</label>
      <textarea
        [(ngModel)]="shopCopyData.description"
        class="input-style"
        type="text"
        id="description"
      ></textarea>
    </div>

    <div class="form-section">
      <div class="column">
        <label for="ville">Ville</label>
        <input
          [(ngModel)]="shopCopyData.ville"
          class="input-style"
          type="text"
          id="ville"
        />
      </div>
      <div class="column">
        <label for="imageUpload">Télécharger une image</label>
        <input
          type="file"
          id="imageUpload"
          (change)="onFileSelected($event)"
          accept="image/*"
          class="input-style"
        />

        <!-- Affichage de l'image sélectionnée -->
        <div *ngIf="imagePreview">
          <p>Aperçu de l'image :</p>
          <img
            [src]="imagePreview"
            alt="Aperçu de l'image"
            class="image-preview small-preview"
          />
        </div>

        <!-- Bouton pour uploader l'image -->
        <button
          class="btn btn-primary"
          (click)="uploadImage()"
          [disabled]="!selectedFile"
        >
          Upload Image
        </button>
      </div>
    </div>

    <div class="form-section">
      <div class="column">
        <label for="latitude">Latitude</label>
        <input
          [(ngModel)]="shopCopyData?.location.latitude"
          class="input-style"
          type="number"
          id="latitude"
        />
      </div>
      <div class="column">
        <label for="longitude">Longitude</label>
        <input
          [(ngModel)]="shopCopyData?.location.longitude"
          class="input-style"
          type="number"
          id="longitude"
        />
      </div>
    </div>
    <h2>Horaires d'ouverture</h2>
    <div class="form-section">
      <div class="column">
        <label for="morningStart">Matin - Ouverture</label>
        <input
          type="time"
          id="morningStart"
          class="input-style"
          [(ngModel)]="shopCopyData.hours.morning.start"
        />
      </div>
      <div class="column">
        <label for="morningEnd">Matin - Fermeture</label>
        <input
          type="time"
          id="morningEnd"
          class="input-style"
          [(ngModel)]="shopCopyData.hours.morning.end"
        />
      </div>
    </div>

    <div class="form-section">
      <div class="column">
        <label for="afternoonStart">Après-midi - Ouverture</label>
        <input
          type="time"
          id="afternoonStart"
          class="input-style"
          [(ngModel)]="shopCopyData.hours.afternoon.start"
        />
      </div>
      <div class="column">
        <label for="afternoonEnd">Après-midi - Fermeture</label>
        <input
          type="time"
          id="afternoonEnd"
          class="input-style"
          [(ngModel)]="shopCopyData.hours.afternoon.end"
        />
      </div>
    </div>

    <div class="form-actions">
      <button (click)="saveShop()" type="submit" class="btn btn-primary">
        Enregistrer la boutique
      </button>
    </div>
  </div>
</div>
