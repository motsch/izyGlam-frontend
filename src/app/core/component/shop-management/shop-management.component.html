<div class="container">
  <div class="form">
    <div class="form-section">
      <div class="column">
        <!-- Affichage de l'image sélectionnée -->
        <div *ngIf="imageUsed">
          <label for="imageUpload" class="margin-top-20"
            >{{ "SHOP_MANAGEMENT.SHOP_IMAGE" | translate}}</label
          >
          <img
            [src]="imageUsed"
            alt="Aperçu de l'image"
            class="image-preview small-preview"
          />
        </div>
        <label for="imageUpload" class="margin-top-20"
          >{{ "SHOP_MANAGEMENT.UPLOAD_IMAGE" | translate}}</label
        >
        <input
          type="file"
          id="imageUpload"
          (change)="onFileSelected($event)"
          accept="image/*"
          class="input-style"
        />
        <div *ngIf="imagePreview">
          <p class="margin-top-20">{{ "SHOP_MANAGEMENT.SNEEK_PIC" | translate}}:</p>
          <img
            [src]="imagePreview"
            alt="Aperçu de l'image"
            class="image-preview small-preview"
          />
        </div>
      </div>
      <div class="column">
        {{shopCopyData.active}}
        <label for="name" class="margin-top-20">{{ "SHOP_MANAGEMENT.SHOP_NAME" | translate}}</label>
        <input
          disabled
          [(ngModel)]="shopCopyData.name"
          class="input-style"
          type="text"
          id="name"
        />
      </div>
    </div>
    <div>
      <label for="description"
        >{{ "SHOP_MANAGEMENT.DESCRIPTION" | translate}}
        <span *ngIf="shopCopyData.description?.length < 25" class="error-text">
          {{ "SHOP_MANAGEMENT.DESC_INFO" | translate}}</span
        ></label
      >
      <textarea
        [(ngModel)]="shopCopyData.description"
        class="input-style"
        type="text"
        id="description"
        (ngModelChange)="markFormModified()"
      ></textarea>
    </div>

    <!-- Coordonnées -->
    <div class="form-section">
      <div class="column">
        <label for="deliveryPostalCode">Codes postaux desservis</label>
        <div class="postal-code-entry">
          <input type="text" [(ngModel)]="deliveryPostalCode" placeholder="Ex: 75001" maxlength="10" />
          <button type="button" class="add-postal-code-btn" (click)="addPostalCode()">
            +
          </button>
        </div>
        <div *ngIf="error.deliveryPostalCode" class="error">{{error.deliveryPostalCode}}</div>
        <div class="postal-code-list">
          <span class="postal-code-tag" *ngFor="let code of shopCopyData.deliveryPostalCodes; let i = index">
            {{ code }}
            <button type="button" class="remove-btn" (click)="removePostalCode(i)">×</button>
          </span>
        </div>
      </div>
      <div class="column">
        <label for="longitude">{{ "SHOP_MANAGEMENT.ZONE" | translate}}</label>
        <input
          [(ngModel)]="shopCopyData.maxDistance"
          class="input-style"
          type="number"
          id="maxDistance"
          (ngModelChange)="markFormModified()"
        />
      </div>
    </div>
    <!-- Horaires -->
    <h2>{{ "SHOP_MANAGEMENT.OPENNING" | translate}}</h2>
    <div class="form-section">
      <div class="column">
        <label for="morningStart">{{ "SHOP_MANAGEMENT.MORNING_OPEN" | translate}}</label>
        <input
          type="time"
          id="morningStart"
          class="input-style"
          [(ngModel)]="shopCopyData.hours.morning.start"
          (ngModelChange)="markFormModified()"
        />
      </div>
      <div class="column">
        <label for="morningEnd">{{ "SHOP_MANAGEMENT.MORNING_CLOSE" | translate}}</label>
        <input
          type="time"
          id="morningEnd"
          class="input-style"
          [(ngModel)]="shopCopyData.hours.morning.end"
          (ngModelChange)="markFormModified()"
        />
      </div>
    </div>
    <!-- Après-midi -->
    <div class="form-section">
      <div class="column">
        <label for="afternoonStart">{{ "SHOP_MANAGEMENT.AFTERNOON_OPEN" | translate}}</label>
        <input
          type="time"
          id="afternoonStart"
          class="input-style"
          [(ngModel)]="shopCopyData.hours.afternoon.start"
          (ngModelChange)="markFormModified()"
        />
      </div>
      <div class="column">
        <label for="afternoonEnd">{{ "SHOP_MANAGEMENT.AFTERNOON_CLOSE" | translate}}</label>
        <input
          type="time"
          id="afternoonEnd"
          class="input-style"
          [(ngModel)]="shopCopyData.hours.afternoon.end"
          (ngModelChange)="markFormModified()"
        />
      </div>
    </div>
    <!-- Bouton de validation -->
    <div class="form-actions">
      <button
        (click)="saveShop()"
        class="btn btn-primary"
      >
      {{ "SHOP_MANAGEMENT.SAVE" | translate}}
      </button>
    </div>
  </div>
</div>
