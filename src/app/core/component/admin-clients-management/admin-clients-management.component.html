<div class="admin-clients-management">
    <div class="search-bar">
      <input type="text" placeholder="Rechercher..." [(ngModel)]="searchTerm" (input)="applyGlobalSearch()">
    </div>
  
    <table mat-table [dataSource]="dataSource" matSort>
      <!-- Nom Column -->
      <ng-container matColumnDef="lastname">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th>
        <td mat-cell *matCellDef="let user">{{ user.lastname }}</td>
      </ng-container>
  
      <!-- Prénom Column -->
      <ng-container matColumnDef="firstname">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Prénom</th>
        <td mat-cell *matCellDef="let user">{{ user.firstname }}</td>
      </ng-container>
  
      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>
  
      <!-- Téléphone Column -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef> Téléphone </th>
        <td mat-cell *matCellDef="let user">{{ user.phone }}</td>
      </ng-container>
  
      <!-- Rôle Column -->
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef> Rôle </th>
        <td mat-cell *matCellDef="let user">
          <select [(ngModel)]="user.role" (change)="updateRole(user)">
            <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
          </select>
        </td>
      </ng-container>
  
      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          <button class="btn create-button" mat-raised-button color="primary" (click)="resetPassword(user)">
          <i class="fa fa-pencil"></i>
          </button>
          <button class="btn delete-button margin-top-10" [ngClass]="user.isBlocked ? 'unlocked' : 'locked'" mat-raised-button color="warn" (click)="toggleBlockUser(user)">
            {{ user.isBlocked ? 'fa fa-check' : 'fa fa-ban' }}
          </button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
