<div class="admin-clients-management">
  <div class="search-bar">
    <input type="text" placeholder="Rechercher..." [(ngModel)]="searchTerm" (input)="applyGlobalSearch()" />
  </div>

  <div class="table-responsive izy-table-responsive">
    <table class="izy-table" mat-table [dataSource]="dataSource" matSort>
      <!-- Nom Column -->
      <ng-container matColumnDef="lastname">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th>
        <td mat-cell *matCellDef="let user">{{ user.lastname }}</td>
      </ng-container>

      <!-- Prénom Column -->
      <ng-container matColumnDef="firstname">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Prénom</th>
        <td mat-cell *matCellDef="let user">{{ user.firstname }}</td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <!-- Téléphone Column -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Téléphone</th>
        <td mat-cell *matCellDef="let user">{{ user.phone }}</td>
      </ng-container>

      <!-- Rôle Column -->
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Rôle</th>
        <td mat-cell *matCellDef="let user">
          <select [(ngModel)]="user.role" (change)="updateRole(user)">
            <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
          </select>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          <button class="btn create-button color_red" mat-raised-button color="primary" (click)="editUser(user)">
            <i class="fa fa-pencil"></i>
          </button>
          <button class="btn ban-button" [ngClass]="user.active ? 'unlocked' : 'locked'" mat-raised-button color="warn"
            (click)="toggleBlockUser(user)">
            <i *ngIf="user.active" class="fa fa-ban"></i>
            <i *ngIf="!user.active" class="fa fa-check"></i>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
<!-- Modal -->
<!-- Modal -->
<div class="modal fade show" tabindex="-1" [style.display]="modalOpen ? 'block' : 'none'"
  [ngClass]="{ show: modalOpen }">
  <div class="modal-dialog custom-modal-width">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Modifier les informations de l'utilisateur</h3>
        <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="firstname">Prénom</label>
          <input type="text" id="firstname" [(ngModel)]="selectedUser.firstname" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="lastname">Nom</label>
          <input type="text" id="lastname" [(ngModel)]="selectedUser.lastname" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" [(ngModel)]="selectedUser.email" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="phone">Téléphone</label>
          <input type="text" id="phone" [(ngModel)]="selectedUser.phone" class="form-control" />
        </div>
        <div class="form-group">
          <label for="sex">Sexe</label>
          <select id="sex" [(ngModel)]="selectedUser.sex" class="form-control" required>
            <option value="male">Homme</option>
            <option value="female">Femme</option>
          </select>
        </div>
        <div class="form-group">
          <label for="role">Rôle</label>
          <select id="role" [(ngModel)]="selectedUser.role" class="form-control" required>
            <option value="user">Utilisateur</option>
            <option value="entreprise">Entreprise</option>
            <option value="professionnel">Professionnel</option>
            <option value="admin">Administrateur</option>
          </select>
        </div>

        <!-- Adresse Principale -->
        <div class="form-group">
          <label>Adresse principale</label>
          <input type="text" [(ngModel)]="selectedUser.address[0].street" placeholder="Rue" class="form-control mb-2" />
          <input type="text" [(ngModel)]="selectedUser.address[0].city" placeholder="Ville" class="form-control mb-2" />
          <input type="text" [(ngModel)]="selectedUser.address[0].code_postal" placeholder="Code postal"
            class="form-control mb-2" />
          <input type="text" [(ngModel)]="selectedUser.address[0].country" placeholder="Pays"
            class="form-control mb-2" />
          <input type="text" [(ngModel)]="selectedUser.address[0].floor" placeholder="Étage"
            class="form-control mb-2" />
          <div class="form-check">
            <input class="form-check-input" type="checkbox" [(ngModel)]="selectedUser.address[0].main"
              id="mainAddress" />
            <label class="form-check-label" for="mainAddress">
              Adresse principale
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="credit">Crédit</label>
          <input type="number" id="credit" [(ngModel)]="selectedUser.credit" class="form-control" />
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeModal()">
          Annuler
        </button>
        <button type="button" class="btn btn-primary" (click)="saveService()">
          Enregistrer
        </button>
      </div>
    </div>
  </div>
</div>
