<div class="profile-card">
    <img [src]="env+profile.image" alt="profile image">
    <div class="profile-info">
        <h3>{{ profile.name }}</h3>
        <p>Coiffeur, {{ profile.ville }}</p>
        <p><i class="star-icon"></i>{{ profile.note }} ({{ profile.reviews.length }} avis)</p>
    </div>
</div>
