<div class="profile-card">
    <div class="image-container">
        <img class="main-image" [src]="imgStorageUrl+profile.image" alt="profile image">
        <img *ngIf="promoVisible" class="overlay-image" [src]="imgStorageUrl+'promo'+profile.promo.type+'.png'"
            alt="overlay image">
    </div>
    <div class="profile-info">
        <h3>{{ profile.name }}</h3>
        <p>{{ profile.trad | translate }}, {{ profile.ville }}</p>
        <p><i class="star-icon"></i>{{ profile.note }} ({{ profile.reviews.length }} {{ "MAIN_PAGE.AVIS" | translate }})</p>
    </div>
</div>
