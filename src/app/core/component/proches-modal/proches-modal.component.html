<h2 mat-dialog-title class="modal-title">
    <span *ngIf="step===1">{{ "PROCHES.TITLE" | translate }}</span>
    <span *ngIf="step===2">{{ "PROCHES.UPDATE" | translate }}</span>
  
  <button mat-icon-button mat-dialog-close class="close-button">
    <mat-icon>close</mat-icon>
  </button>
</h2>
<mat-dialog-content class="modal-content">
  <div class="address-list">
    <span *ngIf="step === 1">
      <div class="address-item" *ngFor="let proche of data.user.proches">
        <mat-icon class="location-icon">location_on</mat-icon>
        <div class="address-info">
          <p class="address">{{ proche.firstname }} {{ proche.lastname }}</p>
          <p class="city">{{ proche.city }}</p>
        </div>
        <mat-icon (click)="editProche(proche)" class="edit-icon">edit</mat-icon>
      </div>
    </span>
    <span *ngIf="step === 2">
        <div class="payment-selection">
          <!--<p>Veuillez entrer les détails de votre carte bancaire :</p>-->
          <form class="payment-form">
            <div class="form-group">
              <label for="prenom">{{ "PROCHES.FIRSTNAME" | translate }}</label>
              <input
              [(ngModel)]="elem.firstname"
              (ngModelChange)="showValidate()"
                type="text"
                id="prenom"
                name="prenom"
                placeholder="Jean"
                required
              />
            </div>
            <div class="form-group">
              <label for="nom">{{ "PROCHES.NAME" | translate }}</label>
              <input
              [(ngModel)]="elem.lastname"
              (ngModelChange)="showValidate()"
                type="text"
                id="nom"
                name="nom"
                placeholder="Dupont"
                required
              />
            </div>
            <div class="form-group">
              <label for="email">{{ "PROCHES.EMAIL" | translate }}</label>
              <input
              [(ngModel)]="elem.email"
              (ngModelChange)="showValidate()"
                type="text"
                id="email"
                name="email"
                placeholder="jean.dupont@gmail.com"
                required
              />
            </div>
            <div class="form-group">
              <label for="phone">{{ "PROCHES.PHONE" | translate }}</label>
              <input
              [(ngModel)]="elem.phone"
              (ngModelChange)="showValidate()"
                type="text"
                id="phone"
                name="phone"
                placeholder="0102030405"
                required
              />
            </div>
          </form>
        </div>
    </span>
  </div>
  <div class="preference-time">
    <button *ngIf="step === 1" (click)="newProche()" mat-button class="schedule-button">{{ "PROCHES.CREATE" | translate }}</button>
    <button *ngIf="step === 2" (click)="stepMinus()" mat-button class="schedule-button">{{ "PROCHES.BACK" | translate }}</button>
    <button *ngIf="step === 2 && validate" mat-button class="schedule-button margin-left-10">{{ "PROCHES.CHANGE" | translate }}</button>
  </div>
</mat-dialog-content>
<mat-dialog-actions class="modal-actions">
  <button mat-button mat-dialog-close>{{ "PROCHES.CLOSE" | translate }}</button>
</mat-dialog-actions>
