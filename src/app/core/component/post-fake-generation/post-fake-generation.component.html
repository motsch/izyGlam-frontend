<div class="post-gen-card">
  <div class="header">
    <div>
      <h3>Assistant de publication</h3>
      <p>Génère un post prêt à publier en 1 clic</p>
    </div>

    <button class="btn-primary" type="button" (click)="generate()">Générer</button>
  </div>

  <div class="controls">
    <select [(ngModel)]="platform" (change)="generate()">
      <option value="instagram">Instagram</option>
      <option value="snapchat">Snapchat</option>
      <option value="tiktok">TikTok</option>
      <option value="facebook">Facebook</option>
    </select>

    <select [(ngModel)]="lang" (change)="generate()">
      <option value="fr">Français</option>
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
  </div>

  <textarea readonly *ngIf="generatedPost">{{ generatedPost }}</textarea>

  <div class="actions" *ngIf="generatedPost">
    <button class="btn-secondary" type="button" (click)="copy()">Copier</button>
    <button class="btn-ghost" type="button" (click)="generate()">Autre suggestion</button>
  </div>

  <div class="error" *ngIf="error">{{ error }}</div>
</div>
