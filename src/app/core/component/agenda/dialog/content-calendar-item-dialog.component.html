<h1 mat-dialog-title>Modifier l'événement</h1>
<div mat-dialog-content>
  <mat-form-field>
    <input matInput placeholder="Titre" [(ngModel)]="data.title">
  </mat-form-field>
  <mat-form-field>
    <input matInput type="datetime-local" placeholder="Début" [(ngModel)]="data.start">
  </mat-form-field>
  <mat-form-field>
    <input matInput type="datetime-local" placeholder="Fin" [(ngModel)]="data.end">
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Annuler</button>
  <button mat-button [mat-dialog-close]="data">Sauvegarder</button>
</div>
