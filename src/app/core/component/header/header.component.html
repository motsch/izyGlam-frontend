<!--Nav start-->
<nav class="navbar fixed-top" [class.darkHeader]="darkHeader">
  <div class="container" *ngIf="!sessionService.getCurrentUser()">
    <a *ngIf="darkHeader" class="navbar-brand" [routerLink]="'/main'"><img [src]="imgStorageUrl+'logo/'+logoLangue+'.png'" class="logo" alt="logo" /></a>
    <a *ngIf="!darkHeader" class="navbar-brand" [routerLink]="'/main'"><img [src]="imgStorageUrl+'logo/alt/'+logoLangue+'.png'" class="logo" alt="logo" /></a>
    <div class="" id="">
      <ul class="" id="">
        <li class=""></li>
        <div class="flex buttons-wrapper">
          <!-- Boutons visibles en grand écran -->
          <button type="button" (click)="routerNavigate('/sign-in')" 
                  class="btn btn-transparent btn-sign-in desktop-only color_glow_secondary"
                  *ngIf="page !== 'connected'">
            {{'INTRO.CONNEXION' | translate}}
          </button>
        
          <button type="button" (click)="routerNavigate('/sign-up')" 
                  class="btn btn-transparent btn-sign-up desktop-only" 
                  [ngClass]="!darkHeader ? 'color_izyglam' : 'color_white'"
                  *ngIf="page !== 'connected'">
            {{'INTRO.REGISTRATION' | translate}}
          </button>
        
          <!-- Bouton de menu hamburger visible sur mobile -->
          <div class="mobile-only">
            <button class="menu-btn" (click)="toggleMobileMenu()">
              <i class="fa fa-bars"></i>
            </button>
        
            <!-- Menu déroulant -->
            <div class="mobile-menu" *ngIf="isMobileMenuOpen">
              <button type="button" (click)="routerNavigate('/sign-in')" class="btn">
                {{'INTRO.CONNEXION' | translate}}
              </button>
              <button type="button" (click)="routerNavigate('/sign-up')" class="btn">
                {{'INTRO.REGISTRATION' | translate}}
              </button>
            </div>
          </div>
        </div>
      </ul>
    </div>
  </div>

  <!-- Connected Menu -->
  <div class="container-fluid" *ngIf="sessionService.getCurrentUser()">
    <div class="row align-items-center w-100">
      <div class="col-auto">
        <a (click)="openDrawer()"><img class="menuBurger" [src]="imgStorageUrl+'menuBurger.png'" alt="logo" /></a>
      </div>
      <div class="col-auto">
        <a class="navbar-brand" [routerLink]="'/main'"><img [src]="imgStorageUrl+'logo/'+logoLangue+'.png'" class="logo" alt="logo" /></a>
      </div>
      <div class="col">
        <!--<button type="button" (click)="openAddressModal()" class="btn color_white ms-4 margin-top-5">
          <img [src]="imgStorageUrl+'location.png'" class="location_icon_left">64 avenue de la République • Maintenant
          <img [src]="imgStorageUrl+'down-chevron.png'" class="location_icon_right">
        </button>-->
      </div>
      
      <div class="col">
        <span type="text" class="form-control search-bar"></span>
      </div>
      <!-- CART -->
      <!--<div class="col-auto">
        <a (click)="openCart()"><img class="cart" [src]="imgStorageUrl+'cart.png'" alt="logo" /></a>
      </div>-->
    </div>
  </div>
</nav>
<!--Nav end -->
