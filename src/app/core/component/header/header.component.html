<!--Nav start-->
<nav class="navbar fixed-top" [class.darkHeader]="darkHeader">
  <div class="container" *ngIf="!sessionService.getCurrentUser()">
    <a class="navbar-brand" [routerLink]="'/'"><img *ngIf="darkHeader" [src]="imgStorageUrl+'logo/'+'glam_logo.png'"
        class="logo" alt="logo" /><img *ngIf="!darkHeader" [src]="imgStorageUrl+'logo/'+'glam_logo2.png'" class="logo"
        alt="logo" /></a>
    <div>
      <ul>
        <li class=""></li>
        <div class="flex buttons-wrapper">
          <!-- Boutons visibles en grand écran -->
          <button type="button" (click)="routerNavigate('/sign-in')" class="btn desktop-only"
            [ngClass]="!darkHeader ? 'color-izyglam' : 'color-izyglam2'" *ngIf="page !== 'connected'">
            {{'INTRO.CONNEXION' | translate}}
          </button>

          <button type="button" (click)="routerNavigate('/sign-up')" class="btn desktop-only"
            [ngClass]="!darkHeader ? 'color_izyglam' : 'color_white'" *ngIf="page !== 'connected'">
            {{'INTRO.REGISTRATION' | translate}}
          </button>

          <!-- Bouton de menu hamburger visible sur mobile -->
          <div class="mobile-only">
            <button class="menu-btn" (click)="toggleMobileMenu()">
              <i *ngIf="darkHeader" class="fa fa-bars color-white"></i>
              <i *ngIf="!darkHeader" class="fa fa-bars color-izyglam"></i>
            </button>

            <!-- Menu déroulant -->
            <div class="mobile-menu" *ngIf="isMobileMenuOpen">
              <button type="button" (click)="routerNavigate('/sign-in')" class="btn">
                {{'INTRO.CONNEXION' | translate}}
              </button>
              <button type="button" (click)="routerNavigate('/sign-up')" class="btn">
                {{'INTRO.REGISTRATION' | translate}}
              </button>
            </div>
          </div>
        </div>
      </ul>
    </div>
  </div>

  <!-- Connected Menu -->
  <div class="container-fluid" *ngIf="sessionService.getCurrentUser()">
    <div class="row align-items-center w-100">
      <div class="col-auto">
        <a (click)="openDrawer()"><img class="menuBurger" [src]="imgStorageUrl+'menuBurger.png'" alt="logo" /></a>
      </div>
      <div class="col-auto">
        <a class="navbar-brand" [routerLink]="'/main'"><img [src]="imgStorageUrl+'logo/'+'glam_logo.png'" class="logo"
            alt="logo" />
          </a>
      </div>
    </div>
  </div>
</nav>
<!--Nav end -->
