<div class="admin-shops-management">
    <div class="search-bar">
      <input type="text" placeholder="Rechercher..." [(ngModel)]="searchTerm" (input)="applyGlobalSearch()">
    </div>
  
    <table mat-table [dataSource]="dataSource" matSort>
      <!-- Nom Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th>
        <td mat-cell *matCellDef="let shop">{{ shop.name }}</td>
      </ng-container>
  
      <!-- Ville Column -->
      <ng-container matColumnDef="ville">
        <th mat-header-cell *matHeaderCellDef>Ville</th>
        <td mat-cell *matCellDef="let shop">{{ shop.ville }}</td>
      </ng-container>
  
      <!-- Note Column -->
      <ng-container matColumnDef="note">
        <th mat-header-cell *matHeaderCellDef>Note</th>
        <td mat-cell *matCellDef="let shop">{{ shop.note }} / 5</td>
      </ng-container>
  
      <!-- Prix moyen Column -->
      <ng-container matColumnDef="averagePrice">
        <th mat-header-cell *matHeaderCellDef>Prix moyen</th>
        <td mat-cell *matCellDef="let shop">{{ shop.averagePrice }}</td>
      </ng-container>
  
      <!-- Promo Column -->
      <ng-container matColumnDef="promo">
        <th mat-header-cell *matHeaderCellDef>Promotion</th>
        <td mat-cell *matCellDef="let shop">
          {{ shop.promo.active ? 'Active' : 'Inactive' }} ({{ shop.promo.type }})
        </td>
      </ng-container>
  
      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let shop">
          <!--<button mat-raised-button color="primary" (click)="editShop(shop)">Éditer</button>-->

          
          <button class="btn create-button" mat-raised-button color="primary" (click)="editShop(shop)">
            <i class="fa fa-pencil"></i>
            </button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
